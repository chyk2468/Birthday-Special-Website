<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Birthday Photo Effects workflow</title><desc id="desc">A React interface accepts a photo, applies a selected visual effect through browser-side canvas processing, and offers the result for download.</desc><rect width="1200" height="400" rx="18" fill="#10182B"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#818CF8">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#F5F6FB">Birthday Photo Effects</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#A9B5CA">Image upload to canvas-based effects and export</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#2D3B55"/><path d="M 300 237 L 330 237" stroke="#A9B5CA" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#A9B5CA" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#A9B5CA" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#A9B5CA" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#A9B5CA" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#A9B5CA" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#1C2940" stroke="#2D3B55" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#818CF8"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#818CF8">01 / UPLOAD</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F5F6FB">Choose a photo</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A9B5CA">Select or drop an image.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#1C2940" stroke="#2D3B55" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#E6A8C7"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#E6A8C7">02 / EFFECT</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F5F6FB">Pick a style</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A9B5CA">Choose a supported visual effect.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#1C2940" stroke="#2D3B55" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#79B8B0"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#79B8B0">03 / CANVAS</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F5F6FB">Process pixels</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A9B5CA">Apply browser-side image operations.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#1C2940" stroke="#2D3B55" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#818CF8"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#818CF8">04 / EXPORT</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F5F6FB">Download image</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A9B5CA">Save the resulting file.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#818CF8">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A9B5CA">Image processing runs in the browser; confirm current supported effects in the app UI.</text></svg>