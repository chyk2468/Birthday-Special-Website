<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img"><rect width="1200" height="390" rx="18" fill="#10182B"/><text x="56" y="42" fill="#818CF8" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FLOW / ANIMATED</text><text x="56" y="80" fill="#F5F6FB" font-family="Arial,sans-serif" font-size="26" font-weight="700">Birthday Photo Effects</text><text x="56" y="108" fill="#A9B5CA" font-family="Arial,sans-serif" font-size="14">Apply visual effects to photos in a simple React interface.</text><line x1="56" y1="128" x2="1144" y2="128" stroke="#2D3B55"/><path d="M 288 236 H 334" stroke="#A9B5CA" stroke-width="1.8"/><path d="M 328 231 L 334 236 L 328 241" stroke="#A9B5CA" fill="none"/><path d="M 576 236 H 622" stroke="#A9B5CA" stroke-width="1.8"/><path d="M 616 231 L 622 236 L 616 241" stroke="#A9B5CA" fill="none"/><path d="M 864 236 H 910" stroke="#A9B5CA" stroke-width="1.8"/><path d="M 904 231 L 910 236 L 904 241" stroke="#A9B5CA" fill="none"/><g><rect x="56" y="154" width="224" height="164" rx="12" fill="#1C2940" stroke="#2D3B55"/><rect x="56" y="154" width="224" height="5" rx="2.5" fill="#818CF8"/><text x="72" y="184" fill="#818CF8" font-family="Arial,sans-serif" font-size="10" font-weight="700">UPLOAD</text><text x="72" y="219" fill="#F5F6FB" font-family="Arial,sans-serif" font-size="15" font-weight="700">Choose photo</text><text x="72" y="248" fill="#A9B5CA" font-family="Arial,sans-serif" font-size="11.5">Select the image to edit.</text><circle cx="260" cy="179" r="4" fill="#818CF8"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><g><rect x="344" y="154" width="224" height="164" rx="12" fill="#1C2940" stroke="#2D3B55"/><rect x="344" y="154" width="224" height="5" rx="2.5" fill="#E6A8C7"/><text x="360" y="184" fill="#E6A8C7" font-family="Arial,sans-serif" font-size="10" font-weight="700">EFFECT</text><text x="360" y="219" fill="#F5F6FB" font-family="Arial,sans-serif" font-size="15" font-weight="700">Pick a style</text><text x="360" y="248" fill="#A9B5CA" font-family="Arial,sans-serif" font-size="11.5">Choose an available visual effect.</text><circle cx="548" cy="179" r="4" fill="#E6A8C7"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle></g><g><rect x="632" y="154" width="224" height="164" rx="12" fill="#1C2940" stroke="#2D3B55"/><rect x="632" y="154" width="224" height="5" rx="2.5" fill="#79B8B0"/><text x="648" y="184" fill="#79B8B0" font-family="Arial,sans-serif" font-size="10" font-weight="700">CANVAS</text><text x="648" y="219" fill="#F5F6FB" font-family="Arial,sans-serif" font-size="15" font-weight="700">Process pixels</text><text x="648" y="248" fill="#A9B5CA" font-family="Arial,sans-serif" font-size="11.5">Apply the effect in the browser.</text><circle cx="836" cy="179" r="4" fill="#79B8B0"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle></g><g><rect x="920" y="154" width="224" height="164" rx="12" fill="#1C2940" stroke="#2D3B55"/><rect x="920" y="154" width="224" height="5" rx="2.5" fill="#818CF8"/><text x="936" y="184" fill="#818CF8" font-family="Arial,sans-serif" font-size="10" font-weight="700">EXPORT</text><text x="936" y="219" fill="#F5F6FB" font-family="Arial,sans-serif" font-size="15" font-weight="700">Save result</text><text x="936" y="248" fill="#A9B5CA" font-family="Arial,sans-serif" font-size="11.5">Download the processed image.</text><circle cx="1124" cy="179" r="4" fill="#818CF8"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle></g><circle r="4.5" fill="#E6A8C7"><animateMotion dur="7s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><circle r="3" fill="#79B8B0"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><text x="56" y="358" fill="#A9B5CA" font-family="Arial,sans-serif" font-size="12">Animated SVG preview. Open architecture.html for interactive stage details.</text></svg>