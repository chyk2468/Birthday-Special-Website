<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Birthday Effects App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>My Birthday Effects</h1>
    </header>

    <main class="hero-section">
        <div class="container">
            <h2>Give Your Photos a Birthday Magic!</h2>
            <p>Upload your memories and apply stunning visual effects.</p>
            
            <section class="upload-area" id="upload-area">
                <input type="file" id="photo-upload" accept="image/*" hidden>
                <div class="upload-card">
                    <p>Click to upload or drag & drop</p>
                </div>
            </section>

            <section class="preview-container" id="preview-container">
                <!-- Image canvas will be here -->
            </section>

            <section class="effects-selector" id="effects-selector">
                <h3>Select an Effect</h3>
                <div class="effects-grid" id="effects-grid">
                    <div class="effect-card" data-effect="original">
                        <div class="effect-preview"></div>
                        <span>Original</span>
                    </div>
                    <div class="effect-card" data-effect="cartoon">
                        <div class="effect-preview"></div>
                        <span>Cartoon</span>
                    </div>
                    <div class="effect-card" data-effect="sketch">
                        <div class="effect-preview"></div>
                        <span>Sketch</span>
                    </div>
                    <div class="effect-card" data-effect="neon">
                        <div class="effect-preview"></div>
                        <span>Neon</span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
