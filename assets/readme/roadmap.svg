      <stop offset="0%" stop-color="#120814"/>
      <stop offset="100%" stop-color="#1F0F24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#C084FC"/>
