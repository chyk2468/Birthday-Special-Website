    <text x="440" y="126" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">IN PROGRESS</text>
    <text x="440" y="160" fill="#F472B6" font-family="system-ui, -apple-system, sans-serif" font-size="12">None currently scheduled.</text>
  </g>
