<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Birthday Effects Site Roadmap</title>
  <desc id="svg-desc">Project Execution Roadmap</desc>
  <defs>
