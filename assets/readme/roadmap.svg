    <rect x="48" y="96" width="346" height="4" rx="2" fill="#10B981"/>
    <text x="68" y="126" fill="#EC4899" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">COMPLETED</text>
