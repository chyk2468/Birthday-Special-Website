      <stop offset="0%" stop-color="#1F0F24"/>
      <stop offset="100%" stop-color="#120814"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EC4899" flood-opacity="0.15"/>
    </filter>
  </defs>
